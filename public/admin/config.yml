backend:
  name: github
  repo: 2110693561/2110693561.github.io
  branch: main
  # Cloudflare Worker OAuth 代理（线上后台通过 GitHub 登录写入仓库）
  base_url: https://decap-oauth-worker.zhanglingbin.workers.dev
  auth_endpoint: auth

# 本地开发：另开一个终端运行 `npm run cms`，后台即可直接读写本地文件（无需登录）
local_backend: true

site_url: https://2110693561.github.io
# 顶栏显示「查看站点」快捷按钮
display_url: https://2110693561.github.io
# 界面中文化
locale: zh_Hans

media_folder: public/images
public_folder: /images

collections:
  # ---------- 站点设置 ----------
  - name: settings
    label: 站点设置
    editor:
      preview: false
    files:
      - name: site
        label: 基础信息
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: 站点名称（导航栏 logo）, widget: string }
          - { name: author, label: 作者名（首页问候语、页脚版权）, widget: string }
          - { name: title, label: 浏览器标签页标题, widget: string }
          - { name: description, label: 站点描述（首页副标题、搜索引擎展示）, widget: text }
          - name: favicon
            label: 浏览器标签页图标
            widget: image
            required: false
            choose_url: true
            hint: 显示在浏览器标签页上的小图标（favicon）。可从媒体库选择、上传本地图片或粘贴链接；留空用默认 /favicon.svg。保存后需刷新浏览器标签页才会更新
          - name: logo
            label: 导航栏 Logo（可选）
            widget: image
            required: false
            choose_url: true
            hint: 网站页面内左上角的标志图片（不是浏览器图标）。可从媒体库选择、上传本地图片或粘贴链接；留空只显示站点名
          - { name: github, label: GitHub 主页链接, widget: string, required: false }
          - { name: repo, label: GitHub 仓库（批注直写用，一般不用改）, widget: string, required: true }

  # ---------- 文章 ----------
  - name: blog
    label: 文章
    label_singular: 文章
    folder: src/content/blog
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    create: true
    editor:
      preview: true
    sortable_fields: [date, title]
    view_filters:
      - { label: 已发布, field: draft, pattern: false }
      - { label: 草稿, field: draft, pattern: true }
      - { label: 已隐藏, field: hidden, pattern: true }
      - { label: 已加密, field: password, pattern: ".+" }
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 日期, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: description, label: 摘要, widget: text, required: false, hint: 显示在列表卡片和搜索结果里 }
      - { name: category, label: 分类, widget: string, required: false, default: 未分类 }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: draft, label: 草稿（不发布）, widget: boolean, default: false, required: false, hint: 打开后只在后台可见，网站和 RSS/搜索都不会出现 }
      - { name: hidden, label: 隐藏（不在列表显示）, widget: boolean, default: false, required: false, hint: 打开后不出现在首页/文章列表/标签/分类/RSS/搜索，但知道链接的人仍可直接访问 }
      - name: password
        label: 查看密码
        widget: string
        required: false
        hint: 设置后内容会加密，访客输入密码才能查看；留空则公开
      - { name: body, label: 正文, widget: markdown }

  # ---------- 随手记 ----------
  - name: notes
    label: 随手记
    label_singular: 随手记
    folder: src/content/notes
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}"
    create: true
    editor:
      preview: true
    view_filters:
      - { label: 已发布, field: draft, pattern: false }
      - { label: 草稿, field: draft, pattern: true }
      - { label: 已隐藏, field: hidden, pattern: true }
      - { label: 已加密, field: password, pattern: ".+" }
    fields:
      - { name: date, label: 日期, widget: datetime, format: "YYYY-MM-DDTHH:mm", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { name: title, label: 标题（可选）, widget: string, required: false }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: draft, label: 草稿（不发布）, widget: boolean, default: false, required: false, hint: 打开后只在后台可见 }
      - { name: hidden, label: 隐藏（不在时间线显示）, widget: boolean, default: false, required: false }
      - name: password
        label: 查看密码
        widget: string
        required: false
        hint: 设置后内容加密，像私密日记一样
      - { name: body, label: 内容, widget: markdown }

  # ---------- 段落批注 ----------
  - name: annotations
    label: 段落批注
    label_singular: 批注
    folder: src/data/annotations
    format: json
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    create: true
    editor:
      preview: false
    fields:
      - name: post
        label: 关联文章（文件名，不含 .md）
        widget: string
        hint: 例如 gd32-gpio-notes；在文章页点「批注」复制 JSON 后从这里取 post 字段
      - { name: index, label: 段落序号, widget: number, value_type: int, min: 0, default: 0, hint: 从 0 开始，对应文章正文的第几个段落块 }
      - { name: quote, label: 段落文字片段（帮助定位，可选）, widget: string, required: false }
      - { name: content, label: 批注内容, widget: markdown, hint: '支持 Markdown；{{netdisk 文件名}} 会渲染为网盘下载卡片（点编辑器右上「🌐 网盘」按钮选文件）' }
      - { name: date, label: 日期, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }

  # ---------- 项目展示 ----------
  - name: projects
    label: 项目展示
    files:
      - name: projects
        label: 项目列表
        file: src/data/projects.json
        format: json
        fields:
          - name: projects
            label: 项目
            widget: list
            fields:
              - { name: name, label: 名称, widget: string }
              - { name: description, label: 描述, widget: text }
              - { name: url, label: 在线访问链接（可选）, widget: string, required: false }
              - name: repo
                label: GitHub 仓库（可选）
                widget: string
                required: false
                hint: 填 owner/仓库名（如 2110693561/mynote）或完整链接，项目卡片会生成可点击的跳转链接
              - { name: tags, label: 标签, widget: list, required: false, default: [] }
              - { name: hidden, label: 隐藏（不在网站显示）, widget: boolean, default: false, required: false }

  # ---------- 资料上传 ----------
  - name: files
    label: 资料上传
    label_singular: 资料
    folder: src/files
    create: true
    editor:
      preview: false
    # 此集合里上传的文件保存到 public/files/（前导斜杠 = 相对仓库根目录，避免被解析到集合目录里）
    media_folder: /public/files
    public_folder: /files
    fields:
      - { name: title, label: 名称, widget: string }
      - { name: date, label: 上传日期, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - name: attachments
        label: 文件（可多个）
        widget: list
        required: true
        hint: 点「+ 添加文件」→「选择文件」→ 上传；重复添加即可传多个文件（md / pdf / zip / word / 图片等）
        fields:
          - name: file
            label: 文件
            widget: file
            choose_url: true
            required: true
          - name: baidu
            label: 百度网盘链接（备用下载源，可选）
            widget: string
            required: false
            hint: 网盘「分享」得到的链接，如 https://pan.baidu.com/s/1xxxx；留空则只显示站内下载按钮。也可由 scripts/baidu-sync.mjs 自动回写
          - name: code
            label: 网盘提取码（可选）
            widget: string
            required: false
            hint: 分享链接的 4 位提取码，无密码可留空
      - { name: description, label: 说明（可选）, widget: text, required: false }
      - { name: hidden, label: 隐藏（不在资料页显示）, widget: boolean, default: false, required: false }
