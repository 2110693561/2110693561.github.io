<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>内容管理后台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* ===== 后台主题：与博客风格统一（清爽浅色 + 靛蓝主色） ===== */
      body {
        background: #f4f5f8;
      }
      #nc-root {
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Noto Sans SC", sans-serif;
        color: #1f2328;
      }

      /* 顶栏 */
      #nc-root [class*="appBar" i] {
        background: #ffffff;
        border-bottom: 1px solid #e6e8ec;
        box-shadow: none;
      }

      /* 侧边栏 */
      #nc-root [class*="sidebar" i] {
        background: #fbfbfd;
        border-right: 1px solid #e6e8ec;
      }

      /* 内容卡片 */
      #nc-root [class*="card" i] {
        border-radius: 10px;
        border: 1px solid #e6e8ec;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
        transition: box-shadow 0.15s ease, transform 0.15s ease,
          border-color 0.15s ease;
      }
      #nc-root [class*="card" i]:hover {
        border-color: #c7cbd4;
        box-shadow: 0 6px 16px rgba(16, 24, 40, 0.08);
        transform: translateY(-1px);
      }

      /* 按钮：只调形状手感，不覆盖语义色 */
      #nc-root button {
        border-radius: 8px;
        font-weight: 500;
        transition: background 0.15s ease, box-shadow 0.15s ease,
          border-color 0.15s ease, opacity 0.15s ease;
      }
      #nc-root [class*="btn" i][class*="primary" i],
      #nc-root [class*="btn-primary" i] {
        background: #4f46e5;
      }
      #nc-root [class*="btn" i][class*="primary" i]:hover,
      #nc-root [class*="btn-primary" i]:hover {
        background: #4338ca;
      }

      /* 表单控件 */
      #nc-root input,
      #nc-root textarea,
      #nc-root select {
        border-radius: 8px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      #nc-root input:focus,
      #nc-root textarea:focus,
      #nc-root select:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
      }

      /* 列表筛选/分组徽章做成胶囊 */
      #nc-root [class*="filter" i] button,
      #nc-root [class*="group" i] button {
        border-radius: 999px;
      }

      /* 编辑器顶部工具栏圆角化 */
      #nc-root [class*="toolbar" i] {
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <!-- Decap CMS：文章 / 随手记 / 批注 / 项目 的网页管理后台 -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3/dist/decap-cms.js"></script>
  </body>
</html>
