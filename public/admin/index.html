<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>内容管理后台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* ============================================================
         后台主题 v2：参考主流后台（Sveltia / Notion 风格）
         现代浅色 + 靛蓝主色，圆角卡片、柔和阴影、清晰层级
         ============================================================ */
      :root {
        --bg: #f5f6fa;
        --panel: #ffffff;
        --border: #e5e8ef;
        --text: #1a1f36;
        --muted: #697089;
        --accent: #1f2937;
        --accent-hover: #0f172a;
        --accent-soft: #eef0f4;
        --danger: #dc2626;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow-sm: 0 1px 2px rgba(23, 26, 46, 0.05);
        --shadow-md: 0 8px 24px rgba(23, 26, 46, 0.09);
      }
      html,
      body {
        background: var(--bg);
      }
      #nc-root,
      #nc-root button,
      #nc-root input,
      #nc-root textarea,
      #nc-root select {
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Noto Sans SC", sans-serif;
      }
      #nc-root {
        color: var(--text);
      }

      /* ---------- 顶栏 ---------- */
      #nc-root [class*="appBar" i] {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        box-shadow: none;
      }

      /* ---------- 侧边栏 ---------- */
      #nc-root [class*="sidebar" i] {
        background: var(--panel);
        border-right: 1px solid var(--border);
      }
      #nc-root [class*="sidebar" i] [class*="link" i],
      #nc-root [class*="sidebar" i] [class*="item" i] {
        border-radius: var(--radius-sm);
        transition: background 0.14s ease, color 0.14s ease;
      }
      #nc-root [class*="sidebar" i] [class*="link" i]:hover {
        background: #f0f2f6;
      }
      /* 侧边栏选中态：中性灰，不用蓝色 */
      #nc-root [class*="sidebar" i] [class*="active" i] {
        background: #e9ecf2;
        color: var(--text) !important;
        font-weight: 600;
      }

      /* ---------- 列表条目：不加边框，避免文字外出现框 ---------- */
      #nc-root [class*="card" i] {
        border-radius: var(--radius);
        border: none;
        background: var(--panel);
        box-shadow: none;
        transition: box-shadow 0.16s ease;
      }
      #nc-root [class*="card" i]:hover {
        box-shadow: var(--shadow-sm);
        transform: none;
      }

      /* ---------- 按钮 ---------- */
      #nc-root button {
        border-radius: var(--radius-sm);
        font-weight: 500;
        transition: background 0.15s ease, box-shadow 0.15s ease,
          border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
      }
      #nc-root [class*="btn" i][class*="primary" i],
      #nc-root [class*="btn-primary" i] {
        background: var(--accent);
        box-shadow: var(--shadow-sm);
      }
      #nc-root [class*="btn" i][class*="primary" i]:hover,
      #nc-root [class*="btn-primary" i]:hover {
        background: var(--accent-hover);
      }

      /* ---------- 表单控件 ---------- */
      #nc-root input,
      #nc-root textarea,
      #nc-root select {
        border-radius: var(--radius-sm);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      #nc-root input:focus,
      #nc-root textarea:focus,
      #nc-root select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(31, 41, 55, 0.13);
      }

      /* ---------- 筛选 / 分组胶囊 ---------- */
      #nc-root [class*="filter" i] button,
      #nc-root [class*="group" i] button {
        border-radius: 999px;
      }

      /* ---------- 编辑器 ---------- */
      #nc-root [class*="toolbar" i] {
        border-radius: var(--radius-sm);
      }
      #nc-root [class*="controlPane" i],
      #nc-root [class*="editorControlBar" i] {
        background: var(--panel);
      }

      /* ---------- 登录页 ---------- */
      #nc-root [class*="AuthenticationPage" i] {
        background: var(--bg);
      }

      /* ---------- 滚动条 ---------- */
      #nc-root ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      #nc-root ::-webkit-scrollbar-thumb {
        background: #cdd2e0;
        border-radius: 999px;
        border: 2px solid var(--bg);
      }
      #nc-root ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ---------- 「回到主页」入口（JS 注入到侧边栏顶部） ---------- */
      #back-to-blog {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin: 14px 16px 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: #eceef4;
        color: var(--text) !important;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        transition: background 0.15s ease, color 0.15s ease;
      }
      #back-to-blog:hover {
        background: #e0e3ec;
        color: var(--text) !important;
      }
      @media (max-width: 720px) {
        #back-to-blog {
          padding: 5px 10px;
          font-size: 12px;
        }
      }
      /* ---------- 明暗主题切换按钮（JS 注入，写入与前台相同的主题键） ---------- */
      #theme-toggle {
        display: flex;
        align-items: center;
        margin: 0 16px 12px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted) !important;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      #theme-toggle:hover {
        background: #eceef4;
        border-color: #c6ccdb;
        color: var(--text) !important;
      }
      /* 随手记列表页「导入笔记」：紧跟「+ 随手记」右侧，同尺寸浅色样式 */
      /* 编辑器内图片：缩略图放大显示，点击看大图 */
      #nc-root .cm-content img,
      #nc-root [class*="markdown" i] img,
      #nc-root [class*="editable" i] img {
        max-width: min(100%, 420px);
        height: auto;
        border-radius: 8px;
        cursor: zoom-in;
      }
      #qa-lightbox {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: rgba(10, 12, 20, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
      }
      #qa-lightbox.on {
        display: flex;
      }
      #qa-lightbox img {
        max-width: 94vw;
        max-height: 92vh;
        border-radius: 10px;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
      }

      #nc-root .qa-import-pill {
        display: inline-flex !important;
        align-items: center;
        gap: 6px;
        margin-left: 10px;
        padding: 8px 18px;
        border-radius: 8px;
        border: 1px solid var(--border) !important;
        background: var(--panel) !important;
        color: var(--text) !important;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        vertical-align: middle;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      #nc-root .qa-import-pill:hover {
        background: #eceef4 !important;
        border-color: #c6ccdb !important;
      }

      /* ---------- 「暂存草稿」按钮（注入在编辑器「保存」按钮左侧） ---------- */
      #save-draft-btn {
        padding: 6px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--panel);
        color: var(--text) !important;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-right: 8px;
        white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      #save-draft-btn:hover {
        border-color: #b9bed0;
        background: #f6f7fb;
      }

      /* ---------- 列表条目去框（不再依赖具体类名，容器一律无边框） ---------- */
      #nc-root [class*="entry" i]:not(input):not(textarea):not(label):not(select):not(button) {
        border: none !important;
        box-shadow: none !important;
      }

      /* ---------- 列表快捷开关（隐藏 / 加密 / 草稿） ---------- */
      #nc-root .qa-group {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        display: inline-flex;
        gap: 6px;
        z-index: 5;
      }
      #nc-root .qa-btn {
        padding: 2px 10px;
        font-size: 12px;
        line-height: 1.6;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted) !important;
        cursor: pointer;
        white-space: nowrap;
      }
      #nc-root .qa-btn:hover {
        border-color: #b9c0cf;
        color: var(--text) !important;
      }
      #nc-root .qa-btn.on {
        background: var(--accent-soft);
        border-color: #9aa3b8;
        color: var(--text) !important;
        font-weight: 600;
      }
      #nc-root .qa-btn.busy {
        opacity: 0.45;
        pointer-events: none;
      }
      #nc-root .qa-btn.delete {
        color: #dc2626 !important;
      }
      #nc-root .qa-btn.delete:hover {
        border-color: #dc2626;
        background: #fef2f2;
      }
      /* ---------- 资料上传列表的内嵌缩略图 ---------- */
      #nc-root .qa-preview {
        position: absolute;
        right: 190px;
        top: 50%;
        transform: translateY(-50%);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 45%;
        overflow: hidden;
        z-index: 4;
      }
      #nc-root .qa-preview img {
        height: 52px;
        max-width: 90px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
        cursor: zoom-in;
      }
      #nc-root .qa-chip {
        font-size: 11px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--accent-soft);
        color: var(--accent-strong) !important;
        text-decoration: none;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      #nc-root .qa-more {
        font-size: 12px;
        color: var(--muted) !important;
        white-space: nowrap;
      }
      /* ---------- 批量上传按钮 ---------- */
      #qa-bulk-upload {
        background: #2e3348;
        color: #fff !important;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        margin-right: 8px;
      }
      #qa-bulk-upload:hover {
        background: #3d4360;
      }
      /* ---------- 导入笔记按钮 ---------- */
      #qa-import-notes {
        background: #2e3348;
        color: #fff !important;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        margin-right: 8px;
      }
      #qa-import-notes:hover {
        background: #3d4360;
      }
      #nc-root .qa-toast {
        position: fixed;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        background: var(--text);
        color: var(--bg);
        padding: 8px 18px;
        border-radius: 999px;
        font-size: 13px;
        z-index: 99999;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      #nc-root .qa-toast.show {
        opacity: 1;
      }

      /* ---------- 夜间模式：与前台 data-theme="dark" 同一套配色 ---------- */
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0e1117;
        --panel: #161b24;
        --border: #262d3d;
        --text: #e6ebf4;
        --muted: #8b96a8;
        --accent: #3a4356;
        --accent-hover: #46516a;
        --accent-soft: #232b3a;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      /* Decap 自带样式会覆盖背景，这里强制压回夜色 */
      html[data-theme="dark"] body,
      html[data-theme="dark"] #nc-root,
      html[data-theme="dark"] #nc-root > div {
        background: var(--bg) !important;
        color: var(--text);
      }
      html[data-theme="dark"] #nc-root [class*="appBar" i],
      html[data-theme="dark"] #nc-root [class*="sidebar" i] {
        background: var(--panel) !important;
      }
      html[data-theme="dark"] #nc-root input,
      html[data-theme="dark"] #nc-root textarea,
      html[data-theme="dark"] #nc-root select {
        background: #1a212e;
        color: var(--text);
        border-color: #303a4d;
      }
      html[data-theme="dark"] #nc-root [class*="sidebar" i] [class*="link" i]:hover {
        background: #1a212e;
      }
      html[data-theme="dark"] #nc-root [class*="sidebar" i] [class*="active" i] {
        background: #232b3a;
        color: var(--text) !important;
      }
      html[data-theme="dark"] #back-to-blog {
        background: #232b3a;
        color: var(--text) !important;
      }
      html[data-theme="dark"] #back-to-blog:hover {
        background: #232a3b;
      }
      html[data-theme="dark"] #theme-toggle:hover {
        background: #232a3b;
        border-color: #3c455e;
        color: var(--text) !important;
      }
      html[data-theme="dark"] #save-draft-btn {
        background: #1a212e;
        color: var(--text) !important;
        border-color: #303a4d;
      }
      html[data-theme="dark"] #nc-root .qa-btn {
        background: #1a212e;
      }
      html[data-theme="dark"] #nc-root .qa-btn.on {
        background: #2b3450;
      }
    </style>
    <script>
      // 与前台共用 localStorage["theme"]：前台切夜间，后台自动跟随；也可在后台直接切换并写回
      (function () {
        function applyTheme() {
          var saved = null;
          try {
            saved = localStorage.getItem("theme");
          } catch (e) {}
          var dark = saved
            ? saved === "dark"
            : window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        }
        window.__setTheme = function (next) {
          try {
            localStorage.setItem("theme", next);
          } catch (e) {}
          document.documentElement.dataset.theme = next;
          var btn = document.getElementById("theme-toggle");
          if (btn) btn.textContent = next === "dark" ? "☀ 切换白天" : "🌙 切换夜间";
        };
        applyTheme();
        window.addEventListener("storage", function (e) {
          if (!e || e.key === "theme") applyTheme();
        });
      })();
    </script>
  </head>
  <body>
    <!-- Decap CMS：文章 / 随手记 / 批注 / 项目 的网页管理后台 -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3/dist/decap-cms.js"></script>
    <script>
      // 预览面板：像原生 Markdown 一样显示（排版与博客前台 .prose 完全一致）
      (function () {
        function registerPreviews() {
          if (!window.CMS || typeof window.CMS.registerPreviewTemplate !== "function") return false;
          if (typeof createClass !== "function" || typeof h !== "function") return false;
          if (window.__qaPreviewRegistered) return true;
          window.__qaPreviewRegistered = true;
          CMS.registerPreviewStyle("/admin/preview.css");
          // 用 Decap 内置 Markdown 渲染 body，套上前台同款 .prose 容器
          var MarkdownPreview = createClass({
            render: function () {
              return h("div", { className: "prose" }, this.props.widgetFor("body"));
            }
          });
          CMS.registerPreviewTemplate("blog", MarkdownPreview);
          CMS.registerPreviewTemplate("notes", MarkdownPreview);
          return true;
        }
        if (!registerPreviews()) {
          var regTimer = setInterval(function () {
            if (registerPreviews()) clearInterval(regTimer);
          }, 100);
        }

        // 把后台明暗主题同步到预览 iframe（深色模式下预览不再白底刺眼）
        function syncPreviewTheme() {
          var theme = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
          Array.prototype.forEach.call(document.querySelectorAll("iframe"), function (f) {
            try {
              if (f.contentDocument && f.contentDocument.documentElement)
                f.contentDocument.documentElement.dataset.theme = theme;
            } catch (e) {}
          });
        }
        syncPreviewTheme();
        new MutationObserver(syncPreviewTheme).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["data-theme"],
        });
        var themePend = null;
        new MutationObserver(function () {
          if (themePend) return;
          themePend = setTimeout(function () {
            themePend = null;
            syncPreviewTheme();
          }, 150);
        }).observe(document.body, { childList: true, subtree: true });
      })();

      // 侧边栏增强：顶部注入「← 回到主页」入口，并隐藏左上角「集合」小标题
      (function () {
        var SITE_URL = "https://2110693561.github.io/";

        function sidebar() {
          return document.querySelector('#nc-root [class*="sidebar" i]');
        }

        // 隐藏「集合 / Collections」小标题：在后台任意位置查找，避免依赖特定容器
        function hideHeading() {
          var root = document.getElementById("nc-root");
          if (!root) return;
          Array.prototype.forEach.call(root.querySelectorAll("*"), function (el) {
            if (el.children.length) return;
            var t = (el.textContent || "").trim();
            if (t === "集合" || /^collections$/i.test(t)) el.style.display = "none";
          });
        }

        function ensure() {
          var host = sidebar() || document.querySelector('[class*="appBar" i]');
          if (!host) return;
          if (!document.getElementById("back-to-blog")) {
            var a = document.createElement("a");
            a.id = "back-to-blog";
            a.href = SITE_URL;
            a.title = "打开博客首页";
            a.textContent = "← 回到主页";
            host.insertBefore(a, host.firstChild);
          }
          if (!document.getElementById("theme-toggle")) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.id = "theme-toggle";
            btn.title = "切换明暗主题（与博客前台同步）";
            btn.addEventListener("click", function () {
              var cur = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
              if (window.__setTheme) window.__setTheme(cur === "dark" ? "light" : "dark");
            });
            var back = document.getElementById("back-to-blog");
            host.insertBefore(btn, back.nextSibling);
          }
          var tb = document.getElementById("theme-toggle");
          if (tb) tb.textContent = document.documentElement.dataset.theme === "dark" ? "☀ 切换白天" : "🌙 切换夜间";
        }

        var pending = null;
        var mo = new MutationObserver(function () {
          if (pending) return;
          pending = setTimeout(function () {
            pending = null;
            ensure();
            hideHeading();
          }, 200);
        });
        function start() {
          if (document.body) {
            mo.observe(document.body, { childList: true, subtree: true });
            ensure();
            hideHeading();
          } else {
            setTimeout(start, 60);
          }
        }
        start();
      })();

      // 「暂存草稿」按钮：一键把当前文章/随手记标记为草稿并保存（提交到仓库，但网站不显示）
      // 仅在含「草稿」开关的编辑页出现；想发布时关掉草稿开关再点「保存」即可
      (function () {
        function draftBox() {
          var labels = Array.prototype.slice.call(document.querySelectorAll("#nc-root label"));
          var label = labels.find(function (l) {
            return /^草稿/.test((l.textContent || "").trim());
          });
          if (!label) return null;
          if (label.htmlFor) {
            var byFor = document.getElementById(label.htmlFor);
            if (byFor && byFor.type === "checkbox") return byFor;
          }
          var own = label.querySelector('input[type="checkbox"]');
          if (own) return own;
          var node = label;
          for (var i = 0; i < 6 && node; i++) {
            node = node.parentElement;
            if (!node) break;
            var box = node.querySelector('input[type="checkbox"]');
            if (box) return box;
          }
          return null;
        }

        function saveButton() {
          var btns = Array.prototype.slice.call(document.querySelectorAll("#nc-root button"));
          return btns.find(function (b) {
            if (b.id === "save-draft-btn") return false;
            var t = (b.textContent || "").trim();
            return t === "保存" || /^保存/.test(t) || /^Save$/i.test(t);
          });
        }

        function onClick() {
          // 1) 打开草稿开关（若未开）
          var box = draftBox();
          if (box && !box.checked) box.click();
          // 2) 等保存按钮变为可用后点击（React 状态更新有短暂延迟）
          var tries = 0;
          (function trySave() {
            var save = saveButton();
            if (save && !save.disabled) {
              save.click();
              return;
            }
            if (++tries < 15) setTimeout(trySave, 120);
          })();
        }

        function ensure() {
          var existing = document.getElementById("save-draft-btn");
          // 没有「草稿」开关的页面（设置/批注/项目/资料）不显示该按钮
          if (!draftBox()) {
            if (existing) existing.remove();
            return;
          }
          if (existing) return;
          var save = saveButton();
          if (!save) return;
          var btn = document.createElement("button");
          btn.type = "button";
          btn.id = "save-draft-btn";
          btn.textContent = "暂存草稿";

        async function bulkUpload(fileList) {
          var t = token();

            alert("批量上传需要登录令牌，请退出后台重新登录");
            return;
          }
          var arr = Array.prototype.slice.call(fileList);
          if (!arr.length) return;
          var name = prompt("给这批资料起个名称：", "资料 " + todayStr());
          if (!name) return;
          try {
            var urls = new Array(arr.length);
            var failed = [];
            var done = 0;
            var CONC = 4; // 并行上传数
            // 小文件先传（快速完成），大文件并行压轴，整体体感更快
            var order = arr
              .map(function (f, i) {
                return { i: i, f: f };
              })
              .sort(function (a, b) {
                return a.f.size - b.f.size;
              });
            var cur = 0;
            async function worker() {
              while (cur < order.length) {
                var it = order[cur++];
                var f = it.f;
                try {
                  var fname = Date.now().toString(36) + "-" + it.i + "-" + safeName(f.name);
                  var mb = (f.size / 1048576).toFixed(1);
                  await ghPutFile(
                    t,

                    await b64OfBlob(f),
                    "上传资料：" + f.name,

                      toast(
                        "上传中 " + f.name + "（" + mb + "MB）" + pct + "% · 完成 " + done + "/" + arr.length
                      );
                    }
                  );
                  urls[it.i] = "/files/" + fname;
                  done++;
                  toast("已完成 " + done + "/" + arr.length + "：" + f.name);
                } catch (err) {
                  done++;
                  failed.push(f.name + "：" + ((err && err.message) || err));
                }

            }
            var workers = [];
            for (var w = 0; w < Math.min(CONC, arr.length); w++) workers.push(worker());
            await Promise.all(workers);
            urls = urls.filter(Boolean);
            if (!urls.length)
              throw new Error("全部文件上传失败：" + failed.join("；"));
            if (failed.length) toast(failed.length + " 个文件失败，其余已上传，正在创建资料条目…");

        async function deleteRepoFile(t, path) {

          var p = String(path).replace(/^\//, "");
          if (/^files\//.test(p)) p = "public/" + p;
          var enc = p.split("/").map(encodeURIComponent).join("/");
          var res = await fetch(GH + "/repos/" + REPO + "/contents/" + enc + "?ref=" + BRANCH, {
            headers: gh(t),
          });
          if (res.status === 404) return; // 文件已不存在，视为成功

          });

        }

        async function importNotesJob(fl, byFolder) {

            return;
          }
          var IMG = /\.(png|jpe?g|gif|webp|svg|bmp)$/i;

            var rp = relOf(f);
            return /\.(md|markdown|txt)$/i.test(rp) && !IMG.test(rp) && !SKIP.test(rp);
          });
          var imgFiles = fl.filter(function (f) {
            var rp = relOf(f);
            return IMG.test(rp) && !SKIP.test(rp);
          });
          if (!mds.length) {
            alert("所选内容里没有 .md / .txt 笔记文件");

              var f = mds[i];

                  raw;

                ? imgFiles.filter(function (im) {

                    if (dir) {
                      var imdir = rp.indexOf("/") >= 0 ? rp.slice(0, rp.lastIndexOf("/")) : "";
                      if (imdir === dir + "/assets" || (imdir === dir && low.indexOf("/assets/") !== -1))
                        return true;

        // 编辑器内图片：JS 扫描标记放大 + 点击灯箱看大图
        (function () {

          function step(img) {
            if (img.classList.contains("qa-big")) return;

            if (

            mo.observe(document.body, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ["src"],
            });
          }
          if (document.body) start();
          else document.addEventListener("DOMContentLoaded", start);

          document.addEventListener(
            "click",
            function (e) {
              var t = e.target;
              var img = t && t.tagName === "IMG" ? t : null;
              if (!img || !img.classList.contains("qa-big")) return;
              e.preventDefault();
              e.stopPropagation();
              lb.querySelector("img").src = img.currentSrc || img.src;
              lb.classList.add("on");
            },
            true
          );
        })();

        function injectImport() {
          if (collection() !== "notes") {
            var oldImp = document.getElementById("qa-import-notes");
            if (oldImp) oldImp.remove();
            var oldFld = document.getElementById("qa-import-folder");
            if (oldFld) oldFld.remove();
            return;
          }
          if (document.getElementById("qa-import-notes")) return;
          // 放在顶部标题卡「+ 随手记」新建按钮右侧（紧挨着）
          var anchor = document.querySelector('#nc-root a[href*="collections/notes/new"]');
          if (!anchor) return;
          var btn = document.createElement("button");
          btn.id = "qa-import-notes";
          btn.type = "button";
          btn.className = "qa-import-pill";
          btn.textContent = "📎 导入笔记";
          btn.title = "选择一个或多个 .md / .txt 文件导入（带图片的笔记建议用旁边的「📁 导入文件夹」）";
          btn.addEventListener("click", function () {
            noteInput.click();
          });
          if (anchor.parentElement) anchor.parentElement.insertBefore(btn, anchor.nextSibling);
          else anchor.parentElement.appendChild(btn);
          // 文件夹导入按钮：推荐用法，选笔记所在文件夹自动带图片
          var folderBtn = document.createElement("button");
          folderBtn.id = "qa-import-folder";
          folderBtn.type = "button";
          folderBtn.className = "qa-import-pill";
          folderBtn.textContent = "📁 导入文件夹";
          folderBtn.title =
            "推荐：选择笔记所在文件夹（Typora 结构：笔记.md + 笔记.assets/ 图片夹），自动上传图片并改写引用";
          folderBtn.addEventListener("click", function () {
            noteFolderInput.click();
          });
          if (btn.parentElement) btn.parentElement.insertBefore(folderBtn, btn.nextSibling);
        }

        // 资料集合的媒体库弹窗：隐藏「媒体资源」旧文件列表，自动停在「上传新的」
        function tameMediaLibrary() {
          if (collection() !== "files") return;
          var nodes = document.querySelectorAll(
            '#nc-root button, #nc-root [role="tab"], #nc-root [class*="tab" i]'
          );
          var uploadTab = null;
          var assetsTab = null;
          for (var i = 0; i < nodes.length; i++) {
            var t = (nodes[i].textContent || "").trim();
            if (t === "上传新的" || /^upload new$/i.test(t)) uploadTab = nodes[i];
            else if (t === "媒体资源" || /^media assets$/i.test(t)) assetsTab = nodes[i];
          }
          if (assetsTab) assetsTab.style.display = "none";
          if (uploadTab && uploadTab.offsetParent !== null) uploadTab.click();
          // 媒体库的上传选择框原生单选，这里强制允许多选（Ctrl/Shift）
          var inputs = document.querySelectorAll('input[type="file"]');
          for (var j = 0; j < inputs.length; j++) {
            if (inputs[j].id !== "qa-bulk-upload" && !inputs[j].multiple) {
              inputs[j].multiple = true;
            }
          }
        }

        var pending = null;
        var mo = new MutationObserver(function () {
          if (pending) return;
          pending = setTimeout(function () {
            pending = null;
            ensure();
            injectUpload();
            injectImport();
            tameMediaLibrary();
          }, 300);
        });
        function start() {
          if (document.body) {
            document.body.appendChild(bulkInput);
            document.body.appendChild(attInput);
            document.body.appendChild(noteInput);
            mo.observe(document.body, { childList: true, subtree: true });
            window.addEventListener("hashchange", function () {
              setTimeout(function () {
                ensure();
                injectUpload();
                injectImport();
                tameMediaLibrary();
              }, 400);
            });
            ensure();
            injectUpload();
            injectImport();
            tameMediaLibrary();
          } else {
            setTimeout(start, 60);
          }
        }
        start();
      })();
    </script>
    <!-- 网盘文件选择器：编辑器内「🌐 网盘」按钮，选文件即插入 {{netdisk 文件名}} -->
    <script src="/netdisk-picker.js" defer></script>
    <!-- 预览面板：{{netdisk ...}} token → 下载卡片 HTML（与构建期 remark-netdisk 逻辑一致） -->
    <script>
    (function () {
      "use strict";

      var TOKEN_RE = /\{\{(?:netdisk|网盘)\s+([^{}]+?)\s*\}\}/g;
      var processedAttr = "data-netdisk-processed";
      var manifest = null;

      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function formatSize(s) {
        if (!isFinite(s) || s <= 0) return "";
        if (s < 1024) return s + " B";
        if (s < 1048576) return (s / 1024).toFixed(1) + " KB";
        return (s / 1048576).toFixed(1) + " MB";
      }

      // parseToken：与 src/utils/netdisk-card.mjs 完全一致
      function parseToken(raw) {
        var parts = raw.split("#");
        var basename = parts[0].trim();
        var shareId = parts.length > 1 ? parts[1].trim() : null;
        var code = parts.length > 2 ? parts[2].trim() : null;
        return {
          basename: basename,
          url: shareId ? "https://pan.baidu.com/s/" + shareId : null,
          code: code || null,
        };
      }

      function findInManifest(basename) {
        if (!manifest || !Array.isArray(manifest.files)) return null;
        for (var i = 0; i < manifest.files.length; i++) {
          if (manifest.files[i].basename === basename) return manifest.files[i];
        }
        return null;
      }

      function buildCard(entry) {
        var name = esc(entry.basename);
        var size = formatSize(entry.size);
        var code = entry.code ? esc(entry.code) : "";
        var meta = [size, code ? "提取码 " + code : null].filter(Boolean).join(" · ");
        var linkHtml;
        if (entry.link) {
          linkHtml = '<a class="nd-btn baidu-btn" href="' + esc(entry.link) + '" target="_blank" rel="noopener">下载</a>';
        } else {
          linkHtml = '<a class="nd-btn nd-disabled" href="/disk/" title="分享链接尚未创建">待分享</a>';
        }
        var copyHtml = code
          ? '<button class="nd-copy code-btn" type="button" data-code="' + code + '" title="点击复制提取码">提取码</button>'
          : "";
        return (
          '<span class="nd-card"><span class="nd-ico">📦</span>' +
          '<span class="nd-info"><span class="nd-name">' + name + '</span><span class="nd-meta">' + esc(meta) + '</span></span>' +
          linkHtml + copyHtml + '</span>'
        );
      }

      function buildMissing(name) {
        return (
          '<span class="nd-card nd-missing"><span class="nd-ico">⚠️</span>' +
          '<span class="nd-info"><span class="nd-name">' + esc(name) + '</span><span class="nd-meta">网盘中未找到该文件</span></span>' +
          '<a class="nd-btn" href="/disk/">查看网盘</a></span>'
        );
      }

      // 在纯文本节点里替换 token → 卡片 HTML
      function processTextNode(node) {
        var text = node.nodeValue;
        if (!text || !/{{/.test(text)) return;

        var parent = node.parentNode;
        if (!parent) return;

        var parts = [];
        var last = 0;
        TOKEN_RE.lastIndex = 0;
        var m;
        while ((m = TOKEN_RE.exec(text)) !== null) {
          var start = m.index;
          if (start > last) parts.push(document.createTextNode(text.slice(last, start)));
          var tokenContent = m[1];

          // 扩展语法：文件名#分享ID#提取码
          var parsed = parseToken(tokenContent);
          var cardHtml;
          if (parsed.url) {
            cardHtml = buildCard({ basename: parsed.basename, size: 0, link: parsed.url, code: parsed.code });
          } else {
            // 标准语法：查清单
            var entry = findInManifest(parsed.basename);
            cardHtml = entry ? buildCard(entry) : buildMissing(parsed.basename);
          }
          var span = document.createElement("span");
          span.innerHTML = cardHtml;
          parts.push(span);
          last = start + m[0].length;
        }
        if (last < text.length) parts.push(document.createTextNode(text.slice(last)));

        // 替换原节点
        var frag = document.createDocumentFragment();
        for (var i = 0; i < parts.length; i++) frag.appendChild(parts[i]);
        parent.replaceChild(frag, node);
      }

      // 递归遍历容器，处理所有纯文本节点（跳过 code/pre/script/style）
      function processContainer(container) {
        if (!container) return;
        // 快速路径：textContent 里没有 {{ 就跳过整个子树
        if (container.nodeType === 1) {
          var tag = container.tagName;
          if (!tag) return;
          // 跳过这些元素：里面的 {{ 应该原样保留
          if (/^(CODE|PRE|SCRIPT|STYLE|TEXTAREA|NOSCRIPT)$/.test(tag)) return;
          // 跳过已经处理过的 nd-card
          if (container.classList && container.classList.contains("nd-card")) return;
          // 快速检查：整个元素的文本里有没有 {{
          var tc = container.textContent;
          if (!tc || tc.indexOf("{{") < 0) return;
        }
        // 检查纯文本节点
        if (container.nodeType === 3 && container.nodeValue && container.nodeValue.indexOf("{{") >= 0) {
          processTextNode(container);
          return;
        }
        if (container.nodeType !== 1) return;
        // 递归子节点（快照，避免修改时遍历器混乱）
        var children = [];
        for (var i = 0; i < container.childNodes.length; i++) {
          children.push(container.childNodes[i]);
        }
        for (var i = 0; i < children.length; i++) {
          processContainer(children[i]);
        }
      }

      // 加载清单（静态 JSON，带 5 分钟缓存）
      function loadManifest() {
        if (manifest) return Promise.resolve(manifest);
        if (loadManifest._pending) return loadManifest._pending;
        loadManifest._pending = fetch("/data/netdisk.json", { cache: "no-cache" })
          .then(function (r) { return r.ok ? r.json() : { files: [] }; })
          .then(function (j) { manifest = j || { files: [] }; return manifest; })
          .catch(function () { manifest = { files: [] }; return manifest; });
        return loadManifest._pending;
      }

      // 提取码复制（预览 iframe 里的 nd-copy 按钮）
      function bindCopyHandler(rootDoc) {
        if (!rootDoc) rootDoc = document;
        rootDoc.addEventListener("click", function (e) {
          var target = e.target && e.target.closest ? e.target.closest(".nd-copy") : null;
          if (!target) return;
          var code = target.dataset.code || "";
          var done = function () {
            var old = target.textContent;
            target.textContent = "✓ 已复制";
            setTimeout(function () { target.textContent = old; }, 1500);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(code).then(done).catch(function () {
              var ta = document.createElement("textarea");
              ta.value = code; ta.style.position = "fixed"; ta.style.opacity = "0";
              document.body.appendChild(ta); ta.select();
              try { document.execCommand("copy"); done(); } catch (err) {}
              document.body.removeChild(ta);
            });
          } else {
            var ta2 = document.createElement("textarea");
            ta2.value = code; ta2.style.position = "fixed"; ta2.style.opacity = "0";
            document.body.appendChild(ta2); ta2.select();
            try { document.execCommand("copy"); done(); } catch (err) {}
            document.body.removeChild(ta2);
          }
        });
      }

      // 监听预览 iframe：setInterval 轮询（比 MutationObserver 更可靠，
      // 因为 Decap 每次输入会重建 iframe 内 DOM，observer 监听的旧容器会失效）
      var processedAttr2 = "data-nd-done";

      function processIframe(iframe) {
        try {
          var doc = iframe.contentDocument || iframe.contentWindow.document;
          if (!doc || !doc.body) return;
          bindCopyHandler(doc);
          // 确保 manifest 已加载（标准 token 需要查清单）
          loadManifest().then(function () {
            processContainer(doc.body);
          });
          // 扩展 token 不需要 manifest，先跑一次
          processContainer(doc.body);
        } catch (e) {
          // 跨域 iframe，跳过
        }
      }

      function attachPreviewObserver() {
        var iframes = document.querySelectorAll("iframe");
        for (var i = 0; i < iframes.length; i++) {
          processIframe(iframes[i]);
        }
      }

      // 也处理顶层页面里的 .prose（管理页自己的 Markdown 预览）
      function attachTopObserver() {
        var containers = document.querySelectorAll(".prose");
        for (var i = 0; i < containers.length; i++) {
          processContainer(containers[i]);
        }
      }

      // 等待 Decap 就绪
      function start() {
        bindCopyHandler(document);
        // setInterval 轮询（800ms）——Decap 每次输入都重建 iframe 内 DOM，
        // MutationObserver 监听旧容器会失效，轮询最可靠
        setInterval(function () {
          attachPreviewObserver();
          attachTopObserver();
        }, 800);
        // 立即跑一次
        attachPreviewObserver();
        attachTopObserver();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start);
      } else {
        start();
      }
    })();
    </script>
