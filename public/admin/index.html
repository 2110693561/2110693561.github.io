<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>内容管理后台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* ============================================================
         后台主题 v2：参考主流后台（Sveltia / Notion 风格）
         现代浅色 + 靛蓝主色，圆角卡片、柔和阴影、清晰层级
         ============================================================ */
      :root {
        --bg: #f5f6fa;
        --panel: #ffffff;
        --border: #e5e8ef;
        --text: #1a1f36;
        --muted: #697089;
        --accent: #1f2937;
        --accent-hover: #0f172a;
        --accent-soft: #eef0f4;
        --danger: #dc2626;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow-sm: 0 1px 2px rgba(23, 26, 46, 0.05);
        --shadow-md: 0 8px 24px rgba(23, 26, 46, 0.09);
      }
      html,
      body {
        background: var(--bg);
      }
      #nc-root,
      #nc-root button,
      #nc-root input,
      #nc-root textarea,
      #nc-root select {
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Noto Sans SC", sans-serif;
      }
      #nc-root {
        color: var(--text);
      }

      /* ---------- 顶栏 ---------- */
      #nc-root [class*="appBar" i] {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        box-shadow: none;
      }

      /* ---------- 侧边栏 ---------- */
      #nc-root [class*="sidebar" i] {
        background: var(--panel);
        border-right: 1px solid var(--border);
      }
      #nc-root [class*="sidebar" i] [class*="link" i],
      #nc-root [class*="sidebar" i] [class*="item" i] {
        border-radius: var(--radius-sm);
        transition: background 0.14s ease, color 0.14s ease;
      }
      #nc-root [class*="sidebar" i] [class*="link" i]:hover {
        background: #f0f2f6;
      }
      /* 侧边栏选中态：中性灰，不用蓝色 */
      #nc-root [class*="sidebar" i] [class*="active" i] {
        background: #e9ecf2;
        color: var(--text) !important;
        font-weight: 600;
      }

      /* ---------- 列表条目：不加边框，避免文字外出现框 ---------- */
      #nc-root [class*="card" i] {
        border-radius: var(--radius);
        border: none;
        background: var(--panel);
        box-shadow: none;
        transition: box-shadow 0.16s ease;
      }
      #nc-root [class*="card" i]:hover {
        box-shadow: var(--shadow-sm);
        transform: none;
      }

      /* ---------- 按钮 ---------- */
      #nc-root button {
        border-radius: var(--radius-sm);
        font-weight: 500;
        transition: background 0.15s ease, box-shadow 0.15s ease,
          border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
      }
      #nc-root [class*="btn" i][class*="primary" i],
      #nc-root [class*="btn-primary" i] {
        background: var(--accent);
        box-shadow: var(--shadow-sm);
      }
      #nc-root [class*="btn" i][class*="primary" i]:hover,
      #nc-root [class*="btn-primary" i]:hover {
        background: var(--accent-hover);
      }

      /* ---------- 表单控件 ---------- */
      #nc-root input,
      #nc-root textarea,
      #nc-root select {
        border-radius: var(--radius-sm);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      #nc-root input:focus,
      #nc-root textarea:focus,
      #nc-root select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(31, 41, 55, 0.13);
      }

      /* ---------- 筛选 / 分组胶囊 ---------- */
      #nc-root [class*="filter" i] button,
      #nc-root [class*="group" i] button {
        border-radius: 999px;
      }

      /* ---------- 编辑器 ---------- */
      #nc-root [class*="toolbar" i] {
        border-radius: var(--radius-sm);
      }
      #nc-root [class*="controlPane" i],
      #nc-root [class*="editorControlBar" i] {
        background: var(--panel);
      }

      /* ---------- 登录页 ---------- */
      #nc-root [class*="AuthenticationPage" i] {
        background: var(--bg);
      }

      /* ---------- 滚动条 ---------- */
      #nc-root ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      #nc-root ::-webkit-scrollbar-thumb {
        background: #cdd2e0;
        border-radius: 999px;
        border: 2px solid var(--bg);
      }
      #nc-root ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ---------- 「回到主页」入口（JS 注入到侧边栏顶部） ---------- */
      #back-to-blog {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin: 14px 16px 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: #eceef4;
        color: var(--text) !important;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        transition: background 0.15s ease, color 0.15s ease;
      }
      #back-to-blog:hover {
        background: #e0e3ec;
        color: var(--text) !important;
      }
      @media (max-width: 720px) {
        #back-to-blog {
          padding: 5px 10px;
          font-size: 12px;
        }
      }

      /* ---------- 「暂存草稿」按钮（注入在编辑器「保存」按钮左侧） ---------- */
      #save-draft-btn {
        padding: 6px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--panel);
        color: var(--text) !important;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-right: 8px;
        white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      #save-draft-btn:hover {
        border-color: #b9bed0;
        background: #f6f7fb;
      }
    </style>
  </head>
  <body>
    <!-- Decap CMS：文章 / 随手记 / 批注 / 项目 的网页管理后台 -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3/dist/decap-cms.js"></script>
    <script>
      // 侧边栏增强：顶部注入「← 回到主页」入口，并隐藏左上角「集合」小标题
      (function () {
        var SITE_URL = "https://2110693561.github.io/";

        function sidebar() {
          return document.querySelector('#nc-root [class*="sidebar" i]');
        }

        // 隐藏「集合 / Collections」小标题：在后台任意位置查找，避免依赖特定容器
        function hideHeading() {
          var root = document.getElementById("nc-root");
          if (!root) return;
          Array.prototype.forEach.call(root.querySelectorAll("*"), function (el) {
            if (el.children.length) return;
            var t = (el.textContent || "").trim();
            if (t === "集合" || /^collections$/i.test(t)) el.style.display = "none";
          });
        }

        function ensure() {
          if (document.getElementById("back-to-blog")) return;
          var host = sidebar() || document.querySelector('[class*="appBar" i]');
          if (!host) return;
          var a = document.createElement("a");
          a.id = "back-to-blog";
          a.href = SITE_URL;
          a.title = "打开博客首页";
          a.textContent = "← 回到主页";
          host.insertBefore(a, host.firstChild);
        }

        var pending = null;
        var mo = new MutationObserver(function () {
          if (pending) return;
          pending = setTimeout(function () {
            pending = null;
            ensure();
            hideHeading();
          }, 200);
        });
        function start() {
          if (document.body) {
            mo.observe(document.body, { childList: true, subtree: true });
            ensure();
            hideHeading();
          } else {
            setTimeout(start, 60);
          }
        }
        start();
      })();

      // 文件型集合（站点设置 / 项目列表）只有一个条目：
      // 点击侧边栏后自动跳过列表页，直接进入编辑页
      (function () {
        var SINGLE = { settings: "site", projects: "projects" };
        function skip() {
          var m = location.hash.match(/^#\/collections\/([a-zA-Z_-]+)\/?$/);
          if (m && SINGLE[m[1]]) {
            location.replace("#/collections/" + m[1] + "/entries/" + SINGLE[m[1]]);
          }
        }
        window.addEventListener("hashchange", skip);
        // 兜底：Decap 内部路由偶尔不触发 hashchange，用轻量轮询补上
        setInterval(skip, 400);
      })();

      // 「暂存草稿」按钮：一键把当前文章/随手记标记为草稿并保存（提交到仓库，但网站不显示）
      // 仅在含「草稿」开关的编辑页出现；想发布时关掉草稿开关再点「保存」即可
      (function () {
        function draftBox() {
          var labels = Array.prototype.slice.call(document.querySelectorAll("#nc-root label"));
          var label = labels.find(function (l) {
            return /^草稿/.test((l.textContent || "").trim());
          });
          if (!label) return null;
          if (label.htmlFor) {
            var byFor = document.getElementById(label.htmlFor);
            if (byFor && byFor.type === "checkbox") return byFor;
          }
          var own = label.querySelector('input[type="checkbox"]');
          if (own) return own;
          var node = label;
          for (var i = 0; i < 6 && node; i++) {
            node = node.parentElement;
            if (!node) break;
            var box = node.querySelector('input[type="checkbox"]');
            if (box) return box;
          }
          return null;
        }

        function saveButton() {
          var btns = Array.prototype.slice.call(document.querySelectorAll("#nc-root button"));
          return btns.find(function (b) {
            if (b.id === "save-draft-btn") return false;
            var t = (b.textContent || "").trim();
            return t === "保存" || /^保存/.test(t) || /^Save$/i.test(t);
          });
        }

        function onClick() {
          // 1) 打开草稿开关（若未开）
          var box = draftBox();
          if (box && !box.checked) box.click();
          // 2) 等保存按钮变为可用后点击（React 状态更新有短暂延迟）
          var tries = 0;
          (function trySave() {
            var save = saveButton();
            if (save && !save.disabled) {
              save.click();
              return;
            }
            if (++tries < 15) setTimeout(trySave, 120);
          })();
        }

        function ensure() {
          var existing = document.getElementById("save-draft-btn");
          // 没有「草稿」开关的页面（设置/批注/项目/资料）不显示该按钮
          if (!draftBox()) {
            if (existing) existing.remove();
            return;
          }
          if (existing) return;
          var save = saveButton();
          if (!save) return;
          var btn = document.createElement("button");
          btn.type = "button";
          btn.id = "save-draft-btn";
          btn.textContent = "暂存草稿";
          btn.title = "保存为草稿：网站不显示、RSS/搜索也不收录；写完想发布时关掉草稿开关再保存";
          btn.addEventListener("click", onClick);
          save.parentElement.insertBefore(btn, save);
        }

        // 节流监听 DOM 变化：页面切换/重渲染后自动补挂按钮
        var pending = null;
        var mo = new MutationObserver(function () {
          if (pending) return;
          pending = setTimeout(function () {
            pending = null;
            ensure();
          }, 200);
        });
        function start() {
          if (document.body) {
            mo.observe(document.body, { childList: true, subtree: true });
            ensure();
          } else {
            setTimeout(start, 60);
          }
        }
        start();
      })();
    </script>
  </body>
</html>
