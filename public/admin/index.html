<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>内容管理后台</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* ============================================================
         后台主题 v2：参考主流后台（Sveltia / Notion 风格）
         现代浅色 + 靛蓝主色，圆角卡片、柔和阴影、清晰层级
         ============================================================ */
      :root {
        --bg: #f5f6fa;
        --panel: #ffffff;
        --border: #e5e8ef;
        --text: #1a1f36;
        --muted: #697089;
        --accent: #1f2937;
        --accent-hover: #0f172a;
        --accent-soft: #eef0f4;
        --danger: #dc2626;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow-sm: 0 1px 2px rgba(23, 26, 46, 0.05);
        --shadow-md: 0 8px 24px rgba(23, 26, 46, 0.09);
      }
      html,
      body {
        background: var(--bg);
      }
      #nc-root,
      #nc-root button,
      #nc-root input,
      #nc-root textarea,
      #nc-root select {
        font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Noto Sans SC", sans-serif;
      }
      #nc-root {
        color: var(--text);
      }

      /* ---------- 顶栏 ---------- */
      #nc-root [class*="appBar" i] {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        box-shadow: none;
      }

      /* ---------- 侧边栏 ---------- */
      #nc-root [class*="sidebar" i] {
        background: var(--panel);
        border-right: 1px solid var(--border);
      }
      #nc-root [class*="sidebar" i] [class*="link" i],
      #nc-root [class*="sidebar" i] [class*="item" i] {
        border-radius: var(--radius-sm);
        transition: background 0.14s ease, color 0.14s ease;
      }
      #nc-root [class*="sidebar" i] [class*="link" i]:hover {
        background: #f0f2f6;
      }
      /* 侧边栏选中态：中性灰，不用蓝色 */
      #nc-root [class*="sidebar" i] [class*="active" i] {
        background: #e9ecf2;
        color: var(--text) !important;
        font-weight: 600;
      }

      /* ---------- 列表条目：不加边框，避免文字外出现框 ---------- */
      #nc-root [class*="card" i] {
        border-radius: var(--radius);
        border: none;
        background: var(--panel);
        box-shadow: none;
        transition: box-shadow 0.16s ease;
      }
      #nc-root [class*="card" i]:hover {
        box-shadow: var(--shadow-sm);
        transform: none;
      }

      /* ---------- 按钮 ---------- */
      #nc-root button {
        border-radius: var(--radius-sm);
        font-weight: 500;
        transition: background 0.15s ease, box-shadow 0.15s ease,
          border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
      }
      #nc-root [class*="btn" i][class*="primary" i],
      #nc-root [class*="btn-primary" i] {
        background: var(--accent);
        box-shadow: var(--shadow-sm);
      }
      #nc-root [class*="btn" i][class*="primary" i]:hover,
      #nc-root [class*="btn-primary" i]:hover {
        background: var(--accent-hover);
      }

      /* ---------- 表单控件 ---------- */
      #nc-root input,
      #nc-root textarea,
      #nc-root select {
        border-radius: var(--radius-sm);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      #nc-root input:focus,
      #nc-root textarea:focus,
      #nc-root select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(31, 41, 55, 0.13);
      }

      /* ---------- 筛选 / 分组胶囊 ---------- */
      #nc-root [class*="filter" i] button,
      #nc-root [class*="group" i] button {
        border-radius: 999px;
      }

      /* ---------- 编辑器 ---------- */
      #nc-root [class*="toolbar" i] {
        border-radius: var(--radius-sm);
      }
      #nc-root [class*="controlPane" i],
      #nc-root [class*="editorControlBar" i] {
        background: var(--panel);
      }

      /* ---------- 登录页 ---------- */
      #nc-root [class*="AuthenticationPage" i] {
        background: var(--bg);
      }

      /* ---------- 滚动条 ---------- */
      #nc-root ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      #nc-root ::-webkit-scrollbar-thumb {
        background: #cdd2e0;
        border-radius: 999px;
        border: 2px solid var(--bg);
      }
      #nc-root ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ---------- 「回到主页」入口（JS 注入到侧边栏顶部） ---------- */
      #back-to-blog {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin: 14px 16px 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: #eceef4;
        color: var(--text) !important;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
        transition: background 0.15s ease, color 0.15s ease;
      }
      #back-to-blog:hover {
        background: #e0e3ec;
        color: var(--text) !important;
      }
      @media (max-width: 720px) {
        #back-to-blog {
          padding: 5px 10px;
          font-size: 12px;
        }
      }
      /* ---------- 明暗主题切换按钮（JS 注入，写入与前台相同的主题键） ---------- */
      #theme-toggle {
        display: flex;
        align-items: center;
        margin: 0 16px 12px;
        padding: 6px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted) !important;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      #theme-toggle:hover {
        background: #eceef4;
        border-color: #c6ccdb;
        color: var(--text) !important;
      }

      /* ---------- 「暂存草稿」按钮（注入在编辑器「保存」按钮左侧） ---------- */
      #save-draft-btn {
        padding: 6px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--panel);
        color: var(--text) !important;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-right: 8px;
        white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      #save-draft-btn:hover {
        border-color: #b9bed0;
        background: #f6f7fb;
      }

      /* ---------- 列表条目去框（不再依赖具体类名，容器一律无边框） ---------- */
      #nc-root [class*="entry" i]:not(input):not(textarea):not(label):not(select):not(button) {
        border: none !important;
        box-shadow: none !important;
      }

      /* ---------- 列表快捷开关（隐藏 / 加密 / 草稿） ---------- */
      #nc-root .qa-group {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        display: inline-flex;
        gap: 6px;
        z-index: 5;
      }
      #nc-root .qa-btn {
        padding: 2px 10px;
        font-size: 12px;
        line-height: 1.6;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted) !important;
        cursor: pointer;
        white-space: nowrap;
      }
      #nc-root .qa-btn:hover {
        border-color: #b9c0cf;
        color: var(--text) !important;
      }
      #nc-root .qa-btn.on {
        background: var(--accent-soft);
        border-color: #9aa3b8;
        color: var(--text) !important;
        font-weight: 600;
      }
      #nc-root .qa-btn.busy {
        opacity: 0.45;
        pointer-events: none;
      }
      #nc-root .qa-btn.delete {
        color: #dc2626 !important;
      }
      #nc-root .qa-btn.delete:hover {
        border-color: #dc2626;
        background: #fef2f2;
      }
      /* ---------- 资料上传列表的内嵌缩略图 ---------- */
      #nc-root .qa-preview {
        position: absolute;
        right: 190px;
        top: 50%;
        transform: translateY(-50%);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 45%;
        overflow: hidden;
        z-index: 4;
      }
      #nc-root .qa-preview img {
        height: 52px;
        max-width: 90px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
        cursor: zoom-in;
      }
      #nc-root .qa-chip {
        font-size: 11px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 6px;
        background: var(--accent-soft);
        color: var(--accent-strong) !important;
        text-decoration: none;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      #nc-root .qa-more {
        font-size: 12px;
        color: var(--muted) !important;
        white-space: nowrap;
      }
      #nc-root .qa-toast {
        position: fixed;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%);
        background: var(--text);
        color: var(--bg);
        padding: 8px 18px;
        border-radius: 999px;
        font-size: 13px;
        z-index: 99999;
        opacity: 0;
        transition: opacity 0.2s ease;
        pointer-events: none;
      }
      #nc-root .qa-toast.show {
        opacity: 1;
      }

      /* ---------- 夜间模式：与前台 data-theme="dark" 同一套配色 ---------- */
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #0e1117;
        --panel: #161b24;
        --border: #262d3d;
        --text: #e6ebf4;
        --muted: #8b96a8;
        --accent: #3a4356;
        --accent-hover: #46516a;
        --accent-soft: #232b3a;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      /* Decap 自带样式会覆盖背景，这里强制压回夜色 */
      html[data-theme="dark"] body,
      html[data-theme="dark"] #nc-root,
      html[data-theme="dark"] #nc-root > div {
        background: var(--bg) !important;
        color: var(--text);
      }
      html[data-theme="dark"] #nc-root [class*="appBar" i],
      html[data-theme="dark"] #nc-root [class*="sidebar" i] {
        background: var(--panel) !important;
      }
      html[data-theme="dark"] #nc-root input,
      html[data-theme="dark"] #nc-root textarea,
      html[data-theme="dark"] #nc-root select {
        background: #1a212e;
        color: var(--text);
        border-color: #303a4d;
      }
      html[data-theme="dark"] #nc-root [class*="sidebar" i] [class*="link" i]:hover {
        background: #1a212e;
      }
      html[data-theme="dark"] #nc-root [class*="sidebar" i] [class*="active" i] {
        background: #232b3a;
        color: var(--text) !important;
      }
      html[data-theme="dark"] #back-to-blog {
        background: #232b3a;
        color: var(--text) !important;
      }
      html[data-theme="dark"] #back-to-blog:hover {
        background: #232a3b;
      }
      html[data-theme="dark"] #theme-toggle:hover {
        background: #232a3b;
        border-color: #3c455e;
        color: var(--text) !important;
      }
      html[data-theme="dark"] #save-draft-btn {
        background: #1a212e;
        color: var(--text) !important;
        border-color: #303a4d;
      }
      html[data-theme="dark"] #nc-root .qa-btn {
        background: #1a212e;
      }
      html[data-theme="dark"] #nc-root .qa-btn.on {
        background: #2b3450;
      }
    </style>
    <script>
      // 与前台共用 localStorage["theme"]：前台切夜间，后台自动跟随；也可在后台直接切换并写回
      (function () {
        function applyTheme() {
          var saved = null;
          try {
            saved = localStorage.getItem("theme");
          } catch (e) {}
          var dark = saved
            ? saved === "dark"
            : window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        }
        window.__setTheme = function (next) {
          try {
            localStorage.setItem("theme", next);
          } catch (e) {}
          document.documentElement.dataset.theme = next;
          var btn = document.getElementById("theme-toggle");
          if (btn) btn.textContent = next === "dark" ? "☀ 切换白天" : "🌙 切换夜间";
        };
        applyTheme();
        window.addEventListener("storage", function (e) {
          if (!e || e.key === "theme") applyTheme();
        });
      })();
    </script>
  </head>
  <body>
    <!-- Decap CMS：文章 / 随手记 / 批注 / 项目 的网页管理后台 -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3/dist/decap-cms.js"></script>
    <script>
      // 侧边栏增强：顶部注入「← 回到主页」入口，并隐藏左上角「集合」小标题
      (function () {
        var SITE_URL = "https://2110693561.github.io/";

        function sidebar() {
          return document.querySelector('#nc-root [class*="sidebar" i]');
        }

        // 隐藏「集合 / Collections」小标题：在后台任意位置查找，避免依赖特定容器
        function hideHeading() {
          var root = document.getElementById("nc-root");
          if (!root) return;
          Array.prototype.forEach.call(root.querySelectorAll("*"), function (el) {
            if (el.children.length) return;
            var t = (el.textContent || "").trim();
            if (t === "集合" || /^collections$/i.test(t)) el.style.display = "none";
          });
        }

        function ensure() {
          var host = sidebar() || document.querySelector('[class*="appBar" i]');
          if (!host) return;
          if (!document.getElementById("back-to-blog")) {
            var a = document.createElement("a");
            a.id = "back-to-blog";
            a.href = SITE_URL;
            a.title = "打开博客首页";
            a.textContent = "← 回到主页";
            host.insertBefore(a, host.firstChild);
          }
          if (!document.getElementById("theme-toggle")) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.id = "theme-toggle";
            btn.title = "切换明暗主题（与博客前台同步）";
            btn.addEventListener("click", function () {
              var cur = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
              if (window.__setTheme) window.__setTheme(cur === "dark" ? "light" : "dark");
            });
            var back = document.getElementById("back-to-blog");
            host.insertBefore(btn, back.nextSibling);
          }
          var tb = document.getElementById("theme-toggle");
          if (tb) tb.textContent = document.documentElement.dataset.theme === "dark" ? "☀ 切换白天" : "🌙 切换夜间";
        }

        var pending = null;
        var mo = new MutationObserver(function () {
          if (pending) return;
          pending = setTimeout(function () {
            pending = null;
            ensure();
            hideHeading();
          }, 200);
        });
        function start() {
          if (document.body) {
            mo.observe(document.body, { childList: true, subtree: true });
            ensure();
            hideHeading();
          } else {
            setTimeout(start, 60);
          }
        }
        start();
      })();

      // 「暂存草稿」按钮：一键把当前文章/随手记标记为草稿并保存（提交到仓库，但网站不显示）
      // 仅在含「草稿」开关的编辑页出现；想发布时关掉草稿开关再点「保存」即可
      (function () {
        function draftBox() {
          var labels = Array.prototype.slice.call(document.querySelectorAll("#nc-root label"));
          var label = labels.find(function (l) {
            return /^草稿/.test((l.textContent || "").trim());
          });
          if (!label) return null;
          if (label.htmlFor) {
            var byFor = document.getElementById(label.htmlFor);
            if (byFor && byFor.type === "checkbox") return byFor;
          }
          var own = label.querySelector('input[type="checkbox"]');
          if (own) return own;
          var node = label;
          for (var i = 0; i < 6 && node; i++) {
            node = node.parentElement;
            if (!node) break;
            var box = node.querySelector('input[type="checkbox"]');
            if (box) return box;
          }
          return null;
        }

        function saveButton() {
          var btns = Array.prototype.slice.call(document.querySelectorAll("#nc-root button"));
          return btns.find(function (b) {
            if (b.id === "save-draft-btn") return false;
            var t = (b.textContent || "").trim();
            return t === "保存" || /^保存/.test(t) || /^Save$/i.test(t);
          });
        }

        function onClick() {
          // 1) 打开草稿开关（若未开）
          var box = draftBox();
          if (box && !box.checked) box.click();
          // 2) 等保存按钮变为可用后点击（React 状态更新有短暂延迟）
          var tries = 0;
          (function trySave() {
            var save = saveButton();
            if (save && !save.disabled) {
              save.click();
              return;
            }
            if (++tries < 15) setTimeout(trySave, 120);
          })();
        }

        function ensure() {
          var existing = document.getElementById("save-draft-btn");
          // 没有「草稿」开关的页面（设置/批注/项目/资料）不显示该按钮
          if (!draftBox()) {
            if (existing) existing.remove();
            return;
          }
          if (existing) return;
          var save = saveButton();
          if (!save) return;
          var btn = document.createElement("button");
          btn.type = "button";
          btn.id = "save-draft-btn";
          btn.textContent = "暂存草稿";
          btn.title = "保存为草稿：网站不显示、RSS/搜索也不收录；写完想发布时关掉草稿开关再保存";
          btn.addEventListener("click", onClick);
          save.parentElement.insertBefore(btn, save);
        }

        // 节流监听 DOM 变化：页面切换/重渲染后自动补挂按钮
        var pending = null;
        var mo = new MutationObserver(function () {
          if (pending) return;
          pending = setTimeout(function () {
            pending = null;
            ensure();
          }, 200);
        });
        function start() {
          if (document.body) {
            mo.observe(document.body, { childList: true, subtree: true });
            ensure();
          } else {
            setTimeout(start, 60);
          }
        }
        start();
      })();

      // 列表快捷开关：在文章/随手记列表直接切换 隐藏 / 加密 / 草稿
      // 原理与批注保存一致：读取 Decap 登录令牌，通过 GitHub Contents API 修改 frontmatter 后提交
      (function () {
        var GH = "https://api.github.com";
        var REPO = "2110693561/2110693561.github.io";
        var BRANCH = "main";
        var LABELS = { blog: "文章", notes: "随手记", annotations: "批注", files: "资料" };
        var cache = {}; // key: col/slug -> { sha, text, state }

        function token() {
          var keys = ["decap-cms-user", "netlify-cms-user"];
          for (var i = 0; i < keys.length; i++) {
            try {
              var raw = localStorage.getItem(keys[i]);
              if (!raw) continue;
              var u = JSON.parse(raw);
              if (u && typeof u.token === "string" && u.token) return u.token;
            } catch (e) {}
          }
          return null;
        }
        function gh(t) {
          return {
            Authorization: "Bearer " + t,
            Accept: "application/vnd.github+json",
            "Content-Type": "application/json",
          };
        }
        // 把 GitHub 的原始错误带出来，方便定位问题
        async function ghError(res) {
          if (res.status === 401) return new Error("登录令牌无效或已过期，请退出后台重新登录");
          var extra = "";
          try {
            var j = await res.json();
            if (j && j.message) extra = "：" + j.message;
          } catch (e) {}
          return new Error("GitHub " + res.status + extra);
        }
        function b64(s) {
          return btoa(String.fromCharCode.apply(null, new TextEncoder().encode(s)));
        }
        function unb64(b) {
          return new TextDecoder().decode(
            Uint8Array.from(atob(b.replace(/\s+/g, "")), function (c) {
              return c.charCodeAt(0);
            })
          );
        }
        function toast(msg) {
          var el = document.querySelector("#nc-root .qa-toast");
          if (!el) {
            el = document.createElement("div");
            el.className = "qa-toast";
            document.getElementById("nc-root").appendChild(el);
          }
          el.textContent = msg;
          el.classList.add("show");
          clearTimeout(el._t);
          el._t = setTimeout(function () {
            el.classList.remove("show");
          }, 2200);
        }
        function collection() {
          var m = location.hash.match(/^#\/collections\/(blog|notes|annotations|files)\/?$/);
          return m ? m[1] : null;
        }
        function parseState(fm) {
          function val(key) {
            var m = fm.match(new RegExp("^" + key + "\\s*:\\s*(.*)$", "m"));
            return m ? m[1].trim().replace(/^["']|["']$/g, "") : "";
          }
          return { draft: val("draft") === "true", hidden: val("hidden") === "true", password: val("password"), title: val("title") };
        }
        function setKey(fm, key, value) {
          var re = new RegExp("^" + key + "\\s*:\\s*.*$", "m");
          var has = re.test(fm);
          if (value === null) return has ? fm.replace(re, "").replace(/\n{2,}/g, "\n") : fm;
          var line = key + ": " + value;
          if (has) return fm.replace(re, line);
          return fm.replace(/\s*$/, "\n") + line + "\n";
        }
        async function load(col, slug) {
          var t = token();
          if (!t) throw new Error("未检测到登录令牌，请退出后台重新登录");
          // 批注集合是 JSON 文件，存放在 src/data/annotations/；资料集合的 md 存放在 src/files/
          var exts = col === "annotations" ? ["json"] : ["md", "mdx"];
          for (var i = 0; i < exts.length; i++) {
            var path =
              col === "annotations"
                ? "src/data/annotations/" + slug + ".json"
                : col === "files"
                  ? "src/files/" + slug + ".md"
                  : "src/content/" + col + "/" + slug + "." + exts[i];
            var res = await fetch(GH + "/repos/" + REPO + "/contents/" + path + "?ref=" + BRANCH, {
              headers: gh(t),
              cache: "no-store",
            });
            if (res.status === 404) continue;
            if (!res.ok) throw await ghError(res);
            var json = await res.json();
            var text = json.encoding === "base64" ? unb64(json.content) : json.content;
            var m = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            var state = { draft: false, hidden: false, password: "", title: "", attachments: [] };
            if (m) {
              state = parseState(m[1]);
              if (col === "files") {
                // 资料：从 frontmatter 提取附件列表（兼容旧版单文件 attachment 字段）
                var atts = [];
                var legacy = m[1].match(/^attachment:\s*([^\n]+)$/m);
                if (legacy)
                  atts.push(
                    legacy[1].trim().replace(/^["']|["']$/g, "").replace(/^\/?public\//, "/")
                  );
                var re = /(^|\n)\s*-\s*file:\s*([^\n]+)/g;
                var mm;
                while ((mm = re.exec(m[1])) !== null) {
                  var u = mm[2].trim().replace(/^["']|["']$/g, "").replace(/^\/?public\//, "/");
                  if (atts.indexOf(u) < 0) atts.push(u);
                }
                state.attachments = atts;
              }
            } else if (col === "annotations") {
              // 批注：标题取 post 字段，用于「原文」跳转与删除确认
              try {
                var j = JSON.parse(text);
                state.title = j.post || slug;
              } catch (e) {
                state.title = slug;
              }
            }
            var entry = { sha: json.sha, path: path, text: text, fm: m ? m[1] : "", state: state };
            cache[col + "/" + slug] = entry;
            return entry;
          }
          return null;
        }
        async function put(col, entry, fm, actionName) {
          var t = token();
          var content = entry.text.replace(/^---\r?\n[\s\S]*?\r?\n---/, "---\n" + fm + "\n---");
          var res = await fetch(GH + "/repos/" + REPO + "/contents/" + entry.path, {
            method: "PUT",
            headers: gh(t),
            body: JSON.stringify({
              message: actionName + "：" + slugOf(entry.path),
              content: b64(content),
              sha: entry.sha,
              branch: BRANCH,
            }),
          });
          if (!res.ok) throw await ghError(res);
          entry.text = content;
          entry.fm = fm;
          entry.state = parseState(fm);
          var meta = await fetch(GH + "/repos/" + REPO + "/contents/" + entry.path + "?ref=" + BRANCH, {
            headers: gh(t),
            cache: "no-store",
          });
          if (meta.ok) entry.sha = (await meta.json()).sha;
        }
        function slugOf(path) {
          return path.split("/").pop().replace(/\.(md|mdx)$/, "");
        }
        async function save(col, slug, patch, actionName) {
          var t = token();
          if (!t) throw new Error("未检测到登录令牌，请退出后台重新登录");
          // 写入前强制取最新版本，避免拿到过期的 sha 导致 409
          delete cache[col + "/" + slug];
          var entry = await load(col, slug);
          if (!entry) throw new Error("找不到条目文件（" + col + "/" + slug + "）");
          var fm = entry.fm;
          if ("draft" in patch) fm = setKey(fm, "draft", String(patch.draft));
          if ("hidden" in patch) fm = setKey(fm, "hidden", String(patch.hidden));
          if ("password" in patch) fm = setKey(fm, "password", patch.password ? JSON.stringify(patch.password) : null);
          try {
            await put(col, entry, fm, actionName);
          } catch (err) {
            // sha 过期（他处已更新）时刷新一次再试
            if (/409|404/.test(err.message)) {
              delete cache[col + "/" + slug];
              var fresh = await load(col, slug);
              if (fresh) {
                var fm2 = fresh.fm;
                if ("draft" in patch) fm2 = setKey(fm2, "draft", String(patch.draft));
                if ("hidden" in patch) fm2 = setKey(fm2, "hidden", String(patch.hidden));
                if ("password" in patch) fm2 = setKey(fm2, "password", patch.password ? JSON.stringify(patch.password) : null);
                await put(col, fresh, fm2, actionName);
                return;
              }
            }
            throw err;
          }
        }
        async function remove(col, slug) {
          var t = token();
          if (!t) throw new Error("未检测到登录令牌，请退出后台重新登录");
          // 同样强制取最新版本，避免 sha 过期 409
          delete cache[col + "/" + slug];
          var entry = await load(col, slug);
          if (!entry) throw new Error("找不到条目文件（" + col + "/" + slug + "）");
          var res = await fetch(GH + "/repos/" + REPO + "/contents/" + entry.path, {
            method: "DELETE",
            headers: gh(t),
            body: JSON.stringify({
              message: "删除" + (LABELS[col] || "内容") + "：" + slug,
              sha: entry.sha,
              branch: BRANCH,
            }),
          });
          if (!res.ok) throw await ghError(res);
          delete cache[col + "/" + slug];
        }

        function mark(btn, on) {
          if (!btn) return;
          btn.classList.toggle("on", !!on);
        }
        function refreshRow(group, state) {
          mark(group.querySelector('[data-k="draft"]'), state.draft);
          mark(group.querySelector('[data-k="hidden"]'), state.hidden);
          mark(group.querySelector('[data-k="password"]'), state.password);
        }
        function buildGroup(col, slug) {
          var group = document.createElement("span");
          group.className = "qa-group";
          var defs;
          if (col === "annotations") {
            // 批注：跳原文 + 删除（没有草稿/隐藏/加密概念）
            defs = [
              { k: "open", label: "原文", title: "跳转到这篇批注所在的文章" },
              { k: "delete", label: "删除", title: "删除：从仓库删除这个批注文件，不可恢复" },
            ];
          } else if (col === "files") {
            // 资料：隐藏 + 删除（内容预览由缩略图直接展示）
            defs = [
              { k: "hidden", label: "隐藏", title: "隐藏：不在资料页显示" },
              { k: "delete", label: "删除", title: "删除：从仓库删除这条资料记录，不可恢复" },
            ];
          } else {
            defs = [
              { k: "draft", label: "草稿", title: "转草稿：保存但不在网站上发布" },
              { k: "hidden", label: "隐藏", title: "隐藏：列表不显示，直接链接仍可访问" },
              { k: "password", label: "加密", title: "加密：访客需输入密码才能查看" },
              { k: "delete", label: "删除", title: "删除：从仓库删除这个文件，不可恢复" },
            ];
          }
          defs.forEach(function (d) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "qa-btn" + (d.k === "delete" ? " delete" : "");
            b.dataset.k = d.k;
            b.textContent = d.label;
            b.title = d.title;
            b.addEventListener("click", async function (e) {
              e.preventDefault();
              e.stopPropagation();
              var col = collection();
              if (!col) return;
              try {
                b.classList.add("busy");
                var entry = cache[col + "/" + slug] || (await load(col, slug));
                if (!entry) throw new Error("找不到条目文件（" + col + "/" + slug + "）");
                if (d.k === "open") {
                  b.classList.remove("busy");
                  var post = entry.state && entry.state.title;
                  if (!post) throw new Error("批注缺少 post 字段，无法跳转");
                  window.open("/posts/" + encodeURIComponent(post) + "/", "_blank");
                  return;
                }
                if (d.k === "delete") {
                  b.classList.remove("busy");
                  if (!confirm("确定删除《" + (entry.state.title || slug) + "》？文件将从仓库删除，不可恢复。")) return;
                  b.classList.add("busy");
                  await remove(col, slug);
                  var row = b.closest("a");
                  if (row) row.remove();
                  toast("已删除，构建后生效");
                  return;
                }
                if (d.k === "password") {
                  if (entry.state.password) {
                    if (!confirm("该内容已加密，确定取消加密？")) {
                      b.classList.remove("busy");
                      return;
                    }
                    await save(col, slug, { password: null }, "取消加密");
                    toast("已取消加密，构建后生效");
                  } else {
                    var pwd = prompt("输入查看密码（留空取消）：");
                    b.classList.remove("busy");
                    if (!pwd) return;
                    await save(col, slug, { password: pwd }, "加密");
                    toast("已加密，构建后生效");
                  }
                } else {
                  var next = !entry.state[d.k];
                  var name = d.k === "draft" ? (next ? "转草稿" : "转为发布") : next ? "隐藏" : "取消隐藏";
                  await save(col, slug, { [d.k]: next }, name);
                  toast(name + "，构建后生效");
                }
                refreshRow(group, entry.state);
                b.classList.remove("busy");
              } catch (err) {
                b.classList.remove("busy");
                alert("操作失败：" + (err instanceof Error ? err.message : err));
              }
            });
            group.appendChild(b);
          });
          return group;
        }

        // 资料上传列表：把附件渲染成缩略图 / 类型徽标
        function renderPreview(row, entry) {
          var prev = row.querySelector(":scope > .qa-preview");
          if (!prev) {
            prev = document.createElement("span");
            prev.className = "qa-preview";
            row.appendChild(prev);
          }
          prev.innerHTML = "";
          var atts = (entry.state && entry.state.attachments) || [];
          atts.slice(0, 4).forEach(function (u) {
            var ext = (u.split("?")[0].split(".").pop() || "").toLowerCase();
            var isImg = ["png", "jpg", "jpeg", "gif", "webp", "svg", "avif", "bmp", "ico"].indexOf(ext) >= 0;
            if (isImg) {
              var img = document.createElement("img");
              img.src = u;
              img.loading = "lazy";
              img.title = "点击查看大图";
              img.addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                window.open(u, "_blank");
              });
              prev.appendChild(img);
            } else {
              var chip = document.createElement("a");
              chip.className = "qa-chip";
              chip.href = u;
              chip.target = "_blank";
              chip.rel = "noopener";
              chip.textContent = (ext || "file").toUpperCase();
              prev.appendChild(chip);
            }
          });
          if (atts.length > 4) {
            var more = document.createElement("span");
            more.className = "qa-more";
            more.textContent = "+" + (atts.length - 4);
            prev.appendChild(more);
          }
        }

        async function ensure() {
          var col = collection();
          if (!col) return;
          var rows = document.querySelectorAll('#nc-root a[href*="/entries/"]');
          Array.prototype.forEach.call(rows, function (a) {
            var slug = decodeURIComponent((a.getAttribute("href") || "").split("/entries/")[1] || "");
            if (!slug) return;
            // 把按钮挂到行的外层容器（li）上，彻底避免点击按钮触发行链接跳转
            var host = a.parentElement && a.parentElement.tagName === "LI" ? a.parentElement : a;
            var existing = host.querySelector(":scope > .qa-group");
            if (existing) return;
            if (getComputedStyle(host).position === "static") host.style.position = "relative";
            var group = buildGroup(col, slug);
            host.appendChild(group);
            var key = col + "/" + slug;
            var render = function (entry) {
              if (!entry) return;
              refreshRow(group, entry.state);
              if (col === "files" && group.isConnected) renderPreview(host, entry);
            };
            if (cache[key]) {
              render(cache[key]);
            } else {
              // 加载失败也保留按钮（本地代理模式没有 GitHub 令牌，点击时会提示）
              load(col, slug)
                .then(function (entry) {
                  if (entry && host.isConnected) render(entry);
                })
                .catch(function () {});
            }
          });
        }

        var pending = null;
        var mo = new MutationObserver(function () {
          if (pending) return;
          pending = setTimeout(function () {
            pending = null;
            ensure();
          }, 300);
        });
        function start() {
          if (document.body) {
            mo.observe(document.body, { childList: true, subtree: true });
            window.addEventListener("hashchange", function () {
              setTimeout(ensure, 400);
            });
            ensure();
          } else {
            setTimeout(start, 60);
          }
        }
        start();
      })();
    </script>
  </body>
</html>
